# ViDoRe v3 Industrial evaluation configuration.
default_profile: default
dataset_adapter: vidore.adapter.ViDoReIndustrialAdapter

paths:
  runs: ${paths.data_root}/vidore/{profile}/runs.jsonl
  scores: ${paths.data_root}/vidore/{profile}/scores.jsonl
  scores_summary: ${paths.data_root}/vidore/{profile}/scores_summary.json

bench_profiles:
  default:
    description: "GLM 5.3 Flash deep agent on ViDoRe Industrial technical orders"
    docgraph_profile: default
    agent_profile: default

    files:
      pathspecs: []
      docs:
        - AFD-091005-062
        - TO_34-1-3
        - AFD-091005-056
        - TO_00-25-172CL-1
        - TO_00-25-260
        - TO_00-25-245_1
        - TO_00-25-172CL-3
        - TO_00-25-203
        - TO_00-25-172CL-5
        - TO_00-25-172CL-4
      limit: null

    runner:
      concurrency: 1
      folder_id: null
      monitoring: null

    grader:
      enabled: true
      llm: DeepSeek-V4-Pro-0813@openrouter
      concurrency: 4

  decision_fast:
    description: "DecisionRAG navigator (Decision Model section selection) + GLM 5.3 Flash synthesis"
    docgraph_profile: default

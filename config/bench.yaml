        - AFD-091005-062
        - TO_34-1-3
        - AFD-091005-056
        - TO_00-25-172CL-1
        - TO_00-25-260
        - TO_00-25-245_1
        - TO_00-25-172CL-3
        - TO_00-25-203
        - TO_00-25-172CL-5
        - TO_00-25-172CL-4
      limit: null

    runner:
      concurrency: 1
      folder_id: null
      monitoring: null

    grader:
      enabled: true
      llm: DeepSeek-V4-Pro-0813@openrouter
